name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chashack_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chashack_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Guard supply-chain policy
        run: "grep -q 'minimumReleaseAge: 4320' pnpm-workspace.yaml"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: SQLite and PostgreSQL same feature suite and API smoke
        env:
          POSTGRES_TEST_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/chashack_ci
        run: |
          for engine in sqlite postgres; do
            if [ "$engine" = postgres ]; then
              export DATABASE_URL="$POSTGRES_TEST_URL"
            else
              unset DATABASE_URL
            fi
            pnpm test
            node apps/bot/scripts/smoke-admin.mjs
          done

      - name: Install vendored runner dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Verify pipeline adoption
        run: python3 .hermes/pipeline/test_adoption.py

      - name: Run generic pipeline gates
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          HPIPE_DIFF_SOURCE: ${{ github.event_name == 'pull_request' && format('{0}...HEAD', github.event.pull_request.base.sha) || format('{0}..HEAD', github.event.before) }}
        run: python3 .hermes/pipeline/run_gate.py g0-laziness secrets db-guard pr-checklist supply-chain decision-citation
