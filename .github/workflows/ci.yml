name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Guard supply-chain policy
        run: "grep -q 'minimumReleaseAge: 4320' pnpm-workspace.yaml"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: API smoke test (auth, static SPA, form, audit)
        run: node apps/bot/scripts/smoke-admin.mjs

      - name: Install vendored runner dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Verify pipeline adoption
        run: python3 .hermes/pipeline/test_adoption.py

      - name: Run generic pipeline gates
        env:
          HPIPE_DIFF_SOURCE: ${{ github.event_name == 'pull_request' && format('{0}...HEAD', github.event.pull_request.base.sha) || format('{0}..HEAD', github.event.before) }}
        run: python3 .hermes/pipeline/run_gate.py g0 secrets db-guard pr-checklist supply-chain decision-citation
