<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Hackathon Admin</title>
    <script>
      // Set theme before first paint: explicit light/dark choice, otherwise
      // follow the OS (system). Syncs BOTH data-theme (our world) and the
      // .dark class (shadcn's class-based dark variant) so text/bg never mismatch.
      try {
        var stored = localStorage.getItem('chas-theme')
        var t = stored === 'light' || stored === 'dark' ? stored : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = t
        if (t === 'dark') document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
