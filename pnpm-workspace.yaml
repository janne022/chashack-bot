packages:
  - apps/*
# Supply-chain risk lock: packages must be published >= 3 days (4320 minutes)
# before pnpm will install them. Do not lower this. Do not add excludes.
allowBuilds:
  esbuild: true
minimumReleaseAge: 4320
minimumReleaseAgeStrict: true
overrides:
  body-parser: 2.4.0
  '@modelcontextprotocol/sdk': 1.32.0
  brace-expansion: 5.0.12
  proxy-addr: 2.0.8
  source-map-js: 1.2.2
  undici@6: 6.29.1
  undici@7: 7.30.1
  zod: 4.6.6
